apiVersion: apps/v1
kind: Deployment
metadata:
  name: example-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: example
  template:
    metadata:
      labels:
        app: example
    spec:
      containers:
      - name: main
        image: alpine
        command: ["sh", "-c", "sleep 3600"]
      ephemeralContainers:
      - name: ephemeral-redis
        image: redis
        ports:
        - containerPort: 6379
          protocol: TCP