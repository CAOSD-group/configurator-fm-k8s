apiVersion: apps/v1
kind: Deployment
metadata:
  name: example-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: example
  template:
    metadata:
      labels:
        app: example
    spec:
      initContainers:
        - name: init-container
          image: alpine
          ports:
            - containerPort: 8080
          lifecycle:
            preStop:
              tcpSocket:
                port: 8080
      containers:
        - name: main-container
          image: nginx
          ports:
            - containerPort: 80