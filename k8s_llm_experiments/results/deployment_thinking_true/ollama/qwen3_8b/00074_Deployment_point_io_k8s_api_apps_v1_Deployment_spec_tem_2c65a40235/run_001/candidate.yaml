apiVersion: apps/v1
kind: Deployment
metadata:
  name: example-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: example
  template:
    metadata:
      labels:
        app: example
    spec:
      initContainers:
        - name: init-container
          image: busybox
          command: ["sh", "-c", "sleep 30"]
          resources:
            requests:
              memory: "64Mi"
              cpu: "250m"
      containers:
        - name: main-container
          image: nginx:latest
          ports:
            - containerPort: 80