apiVersion: apps/v1
kind: Deployment
metadata:
  name: example-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: example
  template:
    metadata:
      labels:
        app: example
    spec:
      containers:
        - name: main-container
          image: nginx
      ephemeralContainers:
        - name: ephemeral-container
          image: busybox
          resources:
            resizePolicy:
              - resource: memory
                quantity: "128Mi"