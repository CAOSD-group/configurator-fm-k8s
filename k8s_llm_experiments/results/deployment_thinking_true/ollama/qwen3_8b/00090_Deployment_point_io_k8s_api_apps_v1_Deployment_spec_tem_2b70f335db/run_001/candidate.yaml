apiVersion: apps/v1
kind: Deployment
metadata:
  name: seccomp-example
spec:
  replicas: 1
  selector:
    matchLabels:
      app: seccomp
  template:
    metadata:
      labels:
        app: seccomp
    spec:
      securityContext:
        seccompProfile:
          type: runtimeDefault
      containers:
      - name: nginx
        image: nginx:latest
        ports:
        - containerPort: 80