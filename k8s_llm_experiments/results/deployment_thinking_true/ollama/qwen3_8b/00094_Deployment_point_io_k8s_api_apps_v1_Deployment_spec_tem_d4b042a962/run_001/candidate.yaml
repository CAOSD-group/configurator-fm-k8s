apiVersion: apps/v1
kind: Deployment
metadata:
  name: example-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: example
  template:
    metadata:
      labels:
        app: example
    spec:
      containers:
      - name: example-container
        image: nginx
      affinity:
        podAntiAffinity:
          topologySpreadConstraints:
          - labelSelector:
              matchExpressions:
              - key: region
                operator: In
                values:
                - us-east-1
            maxSkew: 1
            topologyKey: kubernetes.io/hostname