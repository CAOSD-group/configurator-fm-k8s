---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: flexvolume-example
spec:
  replicas: 1
  selector:
    matchLabels:
      app: flexvolume-example
  template:
    metadata:
      labels:
        app: flexvolume-example
    spec:
      containers:
      - name: app
        image: nginx:latest
        volumeMounts:
        - name: flexvol
          mountPath: /mnt/flexvol
      volumes:
      - name: flexvol
        flexVolume:
          driver: example.com/flexvolume
          parameters:
            fsType: ext4