apiVersion: apps/v1
kind: Deployment
metadata:
  name: example-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: example
  template:
    metadata:
      labels:
        app: example
    spec:
      initContainers:
        - name: init-container
          image: busybox
          command: ["sh", "-c", "while true; do sleep 1; done"]
          lifecycle:
            postStart:
              tcpSocket:
                port: 8080
                host: localhost
      containers:
        - name: main-container
          image: nginx
          ports:
            - containerPort: 80