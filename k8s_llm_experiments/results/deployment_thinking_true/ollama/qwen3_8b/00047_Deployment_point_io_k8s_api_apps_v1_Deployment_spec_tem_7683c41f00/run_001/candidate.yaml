apiVersion: apps/v1
kind: Deployment
metadata:
  name: liveness-probe-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: liveness-probe
  template:
    metadata:
      labels:
        app: liveness-probe
    spec:
      containers:
        - name: main-container
          image: nginx
      ephemeralContainers:
        - name: probe-container
          image: busybox
          livenessProbe:
            httpGet:
              path: /healthz
              port: "8080"
            initialDelaySeconds: 5
            periodSeconds: 10