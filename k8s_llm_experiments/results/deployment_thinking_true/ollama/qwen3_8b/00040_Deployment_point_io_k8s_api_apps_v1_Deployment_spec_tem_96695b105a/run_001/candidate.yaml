apiVersion: apps/v1
kind: Deployment
metadata:
  name: dns-policy-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dns-policy-demo
  template:
    metadata:
      labels:
        app: dns-policy-demo
    spec:
      dnsPolicy: ClusterFirst
      containers:
      - name: nginx
        image: nginx:latest
        ports:
        - containerPort: 80
