apiVersion: apps/v1
kind: Deployment
metadata:
  name: example-deployment
spec:
  replicas: 1
  selector:
    matchExpressions:
      - key: app
        operator: In
        values:
          - myapp
  template:
    metadata:
      labels:
        app: myapp
    spec:
      containers:
        - name: example-container
          image: nginx:latest
          ports:
            - containerPort: 80
      volumes:
        - name: ephemeral-volume
          emptyDir: {}
