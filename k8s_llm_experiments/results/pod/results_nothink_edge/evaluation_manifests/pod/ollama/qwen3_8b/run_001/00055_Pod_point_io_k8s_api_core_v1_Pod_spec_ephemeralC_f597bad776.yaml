apiVersion: v1
kind: Pod
metadata:
  name: bind-mount-pod
spec:
  containers:
  - name: ephemeral-container
    image: busybox
    command:
    - sh
    - -c
    - echo "This is an ephemeral container with bind mount"
    ephemeralContainers:
    - name: ephemeral-container
      image: busybox
      command:
      - sh
      - -c
      - echo "This is an ephemeral container with bind mount"
      volumeMounts:
      - name: test-volume
        mountPath: /mnt/test
        readOnly: true
        bindMountOptions:
          - ro
  volumes:
  - name: test-volume
    emptyDir: {}
