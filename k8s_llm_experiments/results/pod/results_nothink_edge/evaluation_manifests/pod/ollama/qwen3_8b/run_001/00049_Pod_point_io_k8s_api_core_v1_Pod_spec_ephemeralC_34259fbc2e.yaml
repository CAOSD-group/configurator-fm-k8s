apiVersion: v1
kind: Pod
metadata:
  name: ephemeral-container-pod
spec:
  containers:
  - name: main-container
    image: nginx
    resources:
      requests:
        memory: "64Mi"
        cpu: "250m"
  ephemeralContainers:
  - name: ephemeral-container
    image: busybox
    command: ["sh", "-c", "echo 'Ephemeral container running'; sleep 3600"]
    resources:
      requests:
        memory: "32Mi"
        cpu: "125m"
