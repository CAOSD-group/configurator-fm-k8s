apiVersion: v1
kind: Pod
metadata:
  name: example-pod
spec:
  initContainers:
  - name: init-container
    image: busybox
    imagePullPolicy: IfNotPresent
    command:
    - sh
    - -c
    - echo "Init container running"
  containers:
  - name: main-container
    image: nginx
    ports:
    - containerPort: 80
