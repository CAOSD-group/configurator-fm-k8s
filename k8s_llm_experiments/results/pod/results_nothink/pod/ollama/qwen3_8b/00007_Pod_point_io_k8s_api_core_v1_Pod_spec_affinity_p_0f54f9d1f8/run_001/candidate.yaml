apiVersion: v1
kind: Pod
metadata:
  name: example-pod
spec:
  containers:
  - name: example-container
    image: nginx
  affinity:
    podAffinity:
    - labelSelector:
        matchExpressions:
        - key: app
          operator: In
          values:
          - myapp
        - key: env
          operator: In
          values:
          - production
      topologyKey: "kubernetes.io/hostname"
