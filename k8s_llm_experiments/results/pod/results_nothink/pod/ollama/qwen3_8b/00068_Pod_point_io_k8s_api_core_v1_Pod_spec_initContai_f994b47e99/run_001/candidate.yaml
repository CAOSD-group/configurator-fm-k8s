apiVersion: v1
kind: Pod
metadata:
  name: resource-limited-init-pod
spec:
  initContainers:
  - name: init-container
    image: busybox
    command:
    - sh
    - -c
    - echo Initiating...
    resources:
      limits:
        memory: "128Mi"
        cpu: "500m"
  containers:
  - name: main-container
    image: nginx
