apiVersion: v1
kind: Pod
metadata:
  name: example-pod
spec:
  containers:
  - name: example-container
    image: nginx
    resources:
      requests:
        memory: "128Mi"
        cpu: "100m"
        storage: "10Gi"
  volumes:
  - name: example-volume
    persistentVolumeClaim:
      claimName: example-claim
  initContainers:
  - name: init-container
    image: busybox
    command: ["sh", "-c", "echo Initiating container && sleep 10"]
    volumeMounts:
    - name: example-volume
      mountPath: /mnt
  volumes:
  - name: example-volume
    persistentVolumeClaim:
      claimName: example-claim
