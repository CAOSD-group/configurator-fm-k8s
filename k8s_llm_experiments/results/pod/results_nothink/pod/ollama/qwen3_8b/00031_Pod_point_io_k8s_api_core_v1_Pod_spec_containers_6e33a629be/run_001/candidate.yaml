apiVersion: v1
kind: Pod
metadata:
  name: seccomp-pod
spec:
  containers:
  - name: seccomp-container
    image: nginx
    securityContext:
      runAsUser: 1000
      runAsGroup: 3000
      fsGroup: 2000
    resources:
      limits:
        memory: "256Mi"
        cpu: "500m"
    lifecycle:
      preStop:
        exec:
          command: ["sh", "-c", "echo 'Pre-stop command executed'"]
  securityContext:
    seccompProfile:
      type: RuntimeDefault
