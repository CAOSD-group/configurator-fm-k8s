apiVersion: v1
kind: Pod
metadata:
  name: probe-pod
spec:
  containers:
  - name: probe-container
    image: busybox
    command:
      - sh
      - -c
      - "while true; do sleep 10; done"
    readinessProbe:
      tcpSocket:
        port: 80
      initialDelaySeconds: 5
      periodSeconds: 10
    startupProbe:
      tcpSocket:
        port: 80
      initialDelaySeconds: 5
      periodSeconds: 10
      failureThreshold: 12
