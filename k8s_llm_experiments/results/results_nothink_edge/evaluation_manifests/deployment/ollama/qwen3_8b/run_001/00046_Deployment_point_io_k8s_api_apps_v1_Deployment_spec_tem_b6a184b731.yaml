apiVersion: apps/v1
kind: Deployment
metadata:
  name: example-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: example
  template:
    metadata:
      labels:
        app: example
    spec:
      containers:
      - name: main-container
        image: nginx
        ports:
        - containerPort: 80
      ephemeralContainers:
      - name: ephemeral-container
        image: busybox
        lifecycle:
          preStop:
            tcpSocket:
              port: 80
