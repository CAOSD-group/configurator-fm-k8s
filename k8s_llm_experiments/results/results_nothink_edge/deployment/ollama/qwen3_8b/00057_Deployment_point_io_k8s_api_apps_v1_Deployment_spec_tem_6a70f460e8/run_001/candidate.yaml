apiVersion: apps/v1
kind: Deployment
metadata:
  name: seccomp-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: seccomp-demo
  template:
    metadata:
      labels:
        app: seccomp-demo
    spec:
      containers:
      - name: main-container
        image: nginx
        ports:
        - containerPort: 80
      ephemeralContainers:
      - name: seccomp-ephemeral
        image: nginx
        ports:
        - containerPort: 80
        securityContext:
          seccompProfile:
            type: RuntimeDefault
