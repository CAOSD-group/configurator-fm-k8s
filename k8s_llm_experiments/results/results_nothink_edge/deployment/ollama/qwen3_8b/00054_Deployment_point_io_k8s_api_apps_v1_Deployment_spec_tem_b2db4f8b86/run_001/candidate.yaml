apiVersion: apps/v1
kind: Deployment
metadata:
  name: example-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: example
  template:
    metadata:
      labels:
        app: example
    spec:
      containers:
        - name: main-container
          image: nginx
          resources:
            requests:
              memory: "256Mi"
              cpu: "500m"
        - name: ephemeral-container
          image: busybox
          command: ["sh", "-c", "echo 'Ephemeral container running'; sleep 3600"]
          resources:
            requests:
              memory: "128Mi"
              cpu: "250m"
