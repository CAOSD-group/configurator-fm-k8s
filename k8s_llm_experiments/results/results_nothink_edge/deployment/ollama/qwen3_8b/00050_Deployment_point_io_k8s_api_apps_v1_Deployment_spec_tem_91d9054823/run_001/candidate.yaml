apiVersion: apps/v1
kind: Deployment
metadata:
  name: readiness-probe-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: readiness-probe
  template:
    metadata:
      labels:
        app: readiness-probe
    spec:
      containers:
      - name: main-container
        image: nginx
        ports:
        - containerPort: 80
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 10
      ephemeralContainers:
      - name: probe-container
        image: nginx
        ports:
        - containerPort: 80
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 10
