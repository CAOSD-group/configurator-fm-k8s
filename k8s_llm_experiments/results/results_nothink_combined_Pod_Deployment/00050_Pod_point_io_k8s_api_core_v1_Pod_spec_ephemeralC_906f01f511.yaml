apiVersion: v1
kind: Pod
metadata:
  name: test-pod
spec:
  containers:
  - name: main-container
    image: nginx
    resources:
      limits:
        memory: "128Mi"
        cpu: "500m"
  ephemeralContainers:
  - name: test-ephemeral
    image: alpine
    lifecycle:
      postStart:
        exec:
          command:
          - sh
          - -c
          - echo "Post start"
      preStop:
        exec:
          command:
          - sh
          - -c
          - echo "Pre stop"
    terminationMessagePath: /dev/termination-log
    terminationMessagePolicy: File
    imagePullPolicy: IfNotPresent
    securityContext:
      runAsUser: 1000
      runAsGroup: 3000
      fsGroup: 2000
    resources:
      limits:
        memory: "64Mi"
        cpu: "250m"
  restartPolicy:
    exitCode:
      operator: Equal
      value: 0
