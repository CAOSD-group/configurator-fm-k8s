apiVersion: v1
kind: Pod
metadata:
  name: liveness-probe-pod
spec:
  initContainers:
  - name: init-container
    image: busybox
    command:
    - sh
    - -c
    - echo Initiating init container
    lifecycle:
      preStop:
        exec:
          command:
          - sh
          - -c
          - echo Cleaning up init container
    ports:
    - containerPort: 8080
      protocol: TCP
    readinessProbe:
      tcpSocket:
        port: 8080
      initialDelaySeconds: 5
      periodSeconds: 10
    livenessProbe:
      tcpSocket:
        port: 8080
      initialDelaySeconds: 5
      periodSeconds: 10
  containers:
  - name: main-container
    image: nginx
    ports:
    - containerPort: 80
