apiVersion: v1
kind: Pod
metadata:
  name: test-pod
spec:
  initContainers:
  - name: init-container
    image: busybox
    command:
    - sh
    - -c
    - echo Initiating init container
    lifecycle:
      preStop:
        exec:
          command:
          - sh
          - -c
          - echo Pre-stop hook executed
    ports:
    - containerPort: 8080
      protocol: TCP
  containers:
  - name: main-container
    image: nginx
    ports:
    - containerPort: 80
