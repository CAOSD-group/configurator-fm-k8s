apiVersion: apps/v1
kind: Deployment
metadata:
  name: example-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: example
  template:
    metadata:
      labels:
        app: example
    spec:
      containers:
      - name: example-container
        image: nginx
        volumeMounts:
        - name: example-volume
          mountPath: /usr/share/nginx/html
      volumes:
      - name: example-volume
        persistentVolumeClaim:
          claimName: example-claim
  volumeClaimTemplates:
  - metadata:
      name: example-claim
    spec:
      accessModes:
        - ReadWriteOnce
      resources:
        requests:
          storage: 1Gi
      storageClassName: standard
