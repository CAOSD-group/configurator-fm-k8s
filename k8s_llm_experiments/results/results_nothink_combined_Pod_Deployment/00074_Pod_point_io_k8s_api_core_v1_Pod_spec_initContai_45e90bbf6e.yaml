apiVersion: v1
kind: Pod
metadata:
  name: probe-pod
spec:
  initContainers:
  - name: init-container
    image: busybox
    command:
    - sh
    - -c
    - echo Waiting for service to be ready
    ports:
    - containerPort: 8080
      protocol: TCP
    lifecycle:
      preStop:
        tcpSocket:
          port: 8080
  containers:
  - name: main-container
    image: nginx
