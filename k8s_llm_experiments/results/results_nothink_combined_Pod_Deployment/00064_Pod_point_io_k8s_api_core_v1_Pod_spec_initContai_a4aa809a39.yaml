apiVersion: v1
kind: Pod
metadata:
  name: protocol-config-pod
spec:
  initContainers:
  - name: init-container
    image: busybox
    command:
    - sh
    - -c
    - echo "Init container running"
    ports:
    - containerPort: 80
      protocol: TCP
  containers:
  - name: main-container
    image: nginx
    ports:
    - containerPort: 80
      protocol: TCP
