apiVersion: v1
kind: Pod
metadata:
  name: test-pod
spec:
  containers:
  - name: main-container
    image: nginx
    resources:
      limits:
        memory: 256Mi
        cpu: 500m
      requests:
        memory: 128Mi
        cpu: 250m
  ephemeralContainers:
  - name: resize-container
    image: nginx
    resources:
      limits:
        memory: 512Mi
        cpu: 1000m
      requests:
        memory: 256Mi
        cpu: 500m
    resizePolicy:
      resourceName: memory
