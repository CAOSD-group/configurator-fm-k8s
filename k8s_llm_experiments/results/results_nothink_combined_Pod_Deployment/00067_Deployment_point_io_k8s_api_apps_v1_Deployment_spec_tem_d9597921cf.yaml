apiVersion: apps/v1
kind: Deployment
metadata:
  name: liveness-probe-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: liveness-probe-demo
  template:
    metadata:
      labels:
        app: liveness-probe-demo
    spec:
      initContainers:
        - name: init-container
          image: busybox
          command:
            - sh
            - -c
            - echo Initiating init container && sleep 30
          lifecycle:
            preStop:
              exec:
                command:
                  - sh
                  - -c
                  - echo Cleaning up init container
      containers:
        - name: main-container
          image: nginx
          ports:
            - containerPort: 80
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
