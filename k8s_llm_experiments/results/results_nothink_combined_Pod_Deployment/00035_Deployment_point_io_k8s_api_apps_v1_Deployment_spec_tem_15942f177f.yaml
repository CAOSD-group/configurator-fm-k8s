apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: app
  template:
    metadata:
      labels:
        app: app
    spec:
      containers:
      - name: app-container
        image: nginx:latest
        securityContext:
          runAsUser: 1000
          runAsGroup: 1000
          fsGroup: 2000
        resources:
          limits:
            memory: "256Mi"
            cpu: "500m"
        volumeMounts:
        - name: app-volume
          mountPath: /usr/share/nginx/html
      securityContext:
        runAsNonRoot: true
        appArmorProfile:
          type: localhost
      volumes:
      - name: app-volume
        emptyDir: {}
