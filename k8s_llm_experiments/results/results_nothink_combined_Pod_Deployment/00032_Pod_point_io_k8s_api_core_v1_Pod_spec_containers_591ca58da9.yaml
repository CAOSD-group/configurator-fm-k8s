apiVersion: v1
kind: Pod
metadata:
  name: probe-pod
spec:
  containers:
  - name: probe-container
    image: nginx
    ports:
    - containerPort: 80
    lifecycle:
      preStop:
        exec:
          command: ["sh", "-c", "echo 'Shutting down...'; sleep 2"]
      startupProbe:
        httpGet:
          path: /
          port: 80
        initialDelaySeconds: 5
        periodSeconds: 5
        timeoutSeconds: 1
        successThreshold: 1
        failureThreshold: 5
