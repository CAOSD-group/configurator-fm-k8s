apiVersion: apps/v1
kind: Deployment
metadata:
  name: seccomp-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: seccomp-demo
  template:
    metadata:
      labels:
        app: seccomp-demo
    spec:
      containers:
      - name: demo
        image: nginx
        securityContext:
          seccompProfile:
            type: RuntimeDefault
