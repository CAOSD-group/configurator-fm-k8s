apiVersion: apps/v1
kind: Deployment
metadata:
  name: trust-bundle-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: trust-bundle
  template:
    metadata:
      labels:
        app: trust-bundle
    spec:
      containers:
      - name: trust-bundle-container
        image: busybox
        command:
        - sh
        - -c
        - echo "Trust bundle mounted"
        volumeMounts:
        - name: trust-bundle-volume
          mountPath: /etc/trust-bundle
      volumes:
      - name: trust-bundle-volume
        projected:
          sources:
          - configMap:
              name: trust-bundle-config
              items:
              - key: trust-bundle.pem
                path: trust-bundle.pem
          - secret:
              name: trust-bundle-secret
              items:
              - key: trust-bundle.key
                path: trust-bundle.key
