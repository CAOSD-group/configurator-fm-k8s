kind: Deployment
spec:
  selector: true
  template:
    spec:
      dnsPolicy: ClusterFirst
      preemptionPolicy: PreemptLowerPriority
      restartPolicy: Always
      containers:
        imagePullPolicy: Always
        name:
      securityContext:
        fsGroup: true
        fsGroupChangePolicy: Always
        runAsGroup: true
        runAsUser: true
        seLinuxChangePolicy: MountOption
        supplementalGroupsPolicy: Strict
