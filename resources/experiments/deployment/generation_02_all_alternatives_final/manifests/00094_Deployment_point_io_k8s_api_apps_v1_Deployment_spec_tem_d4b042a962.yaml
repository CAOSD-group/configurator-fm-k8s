apiVersion: apps/v1
kind: Deployment
spec:
  selector: {}
  template:
    spec:
      containers:
      - name: fm-container-1
      topologySpreadConstraints:
      - labelSelector:
          matchExpressions:
          - operator: DoesNotExist
            key: fm-key
        maxSkew: 1
        topologyKey: fm-topologykey-1
        whenUnsatisfiable: fm-whenunsatisfiable-1
metadata:
  name: fm-pilot-deployment
