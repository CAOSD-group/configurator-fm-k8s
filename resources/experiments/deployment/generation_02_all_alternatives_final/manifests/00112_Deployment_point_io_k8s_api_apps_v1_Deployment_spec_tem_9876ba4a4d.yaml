apiVersion: apps/v1
kind: Deployment
spec:
  selector: {}
  template:
    spec:
      containers:
      - name: fm-container-1
      volumes:
      - projected:
          sources:
          - clusterTrustBundle:
              labelSelector:
                matchExpressions:
                - operator: DoesNotExist
                  key: fm-key
              path: fm-path
        name: fm-volume-1
metadata:
  name: fm-pilot-deployment
