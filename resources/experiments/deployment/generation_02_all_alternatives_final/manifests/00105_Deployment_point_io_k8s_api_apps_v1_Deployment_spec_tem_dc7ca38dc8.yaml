apiVersion: apps/v1
kind: Deployment
spec:
  selector: {}
  template:
    spec:
      containers:
      - name: fm-container-1
      volumes:
      - ephemeral:
          volumeClaimTemplate:
            spec:
              selector:
                matchExpressions:
                - operator: DoesNotExist
                  key: fm-key
        name: fm-volume-1
metadata:
  name: fm-pilot-deployment
