apiVersion: apps/v1
kind: Deployment
spec:
  selector: true
  template:
    spec:
      containers: []
      securityContext:
        fsGroup: true
        fsGroupChangePolicy: Always
        runAsGroup: true
        runAsUser: true
        seLinuxChangePolicy: MountOption
        supplementalGroupsPolicy: Strict
        appArmorProfile:
          type: Localhost
          localhostProfile: true
metadata:
  name: fm-pilot-deployment
