apiVersion: apps/v1
kind: Deployment
spec:
  selector: {}
  template:
    spec:
      containers:
      - name: fm-container-1
      securityContext:
        fsGroup: 1
        fsGroupChangePolicy: Always
        runAsGroup: 1
        runAsUser: 1
        seLinuxChangePolicy: MountOption
        supplementalGroupsPolicy: Strict
        appArmorProfile:
          type: Unconfined
metadata:
  name: fm-pilot-deployment
