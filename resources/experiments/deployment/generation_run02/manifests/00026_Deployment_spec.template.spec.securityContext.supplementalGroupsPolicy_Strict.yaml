apiVersion: apps/v1
kind: Deployment
spec:
  selector: {}
  template:
    spec:
      containers:
      - name: fm-container-1
      securityContext:
        fsGroup: 1
        fsGroupChangePolicy: Always
        runAsGroup: 1
        runAsUser: 1
        seLinuxChangePolicy: Recursive
        supplementalGroupsPolicy: Strict
metadata:
  name: fm-pilot-deployment
