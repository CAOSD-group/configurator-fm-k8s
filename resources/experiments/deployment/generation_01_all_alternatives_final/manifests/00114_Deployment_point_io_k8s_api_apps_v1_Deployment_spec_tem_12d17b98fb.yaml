apiVersion: apps/v1
kind: Deployment
spec:
  selector: {}
  template:
    spec:
      containers:
      - name: fm-container-1
      volumes:
      - projected:
          sources:
          - podCertificate:
              keyType: ECDSAP256
              signerName: fm-signername
        name: fm-volume-1
metadata:
  name: fm-pilot-deployment
