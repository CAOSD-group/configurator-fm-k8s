          # - Alternative Variant: ext4 (Specific value: ext4)
          # - Alternative Variant: ntfs (Specific value: ntfs)
          fsType: xfs  # fsType is the filesystem type of the volume that you want to mount. Tip: Ensure that the filesystem type is supported by the host operating system. Examples: "ext4", "xfs", "ntfs". Implicitly inferred to be "ext4" if unspecified. More info: https://kubernetes.io/docs/concepts/storage/volumes#rbd
