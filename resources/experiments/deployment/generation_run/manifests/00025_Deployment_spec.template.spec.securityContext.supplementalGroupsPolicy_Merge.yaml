apiVersion: apps/v1
kind: Deployment
spec:
  selector: true
  template:
    spec:
      containers: []
      securityContext:
        fsGroup: true
        fsGroupChangePolicy: Always
        runAsGroup: true
        runAsUser: true
        seLinuxChangePolicy: Recursive
        supplementalGroupsPolicy: Merge
metadata:
  name: fm-pilot-deployment
