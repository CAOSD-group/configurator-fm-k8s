apiVersion: v1
kind: Pod
metadata:
  name: fm-pilot-pod
spec:
  containers:
  - name: fm-container-1
  affinity:
    podAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
      - namespaceSelector:
          matchExpressions:
          - operator: DoesNotExist
            key: fm-key
        topologyKey: fm-topologykey
