apiVersion: v1
kind: Pod
metadata:
  name: fm-pilot-pod
spec:
  containers:
  - name: fm-container-1
  affinity:
    podAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
      - podAffinityTerm:
          labelSelector:
            matchExpressions:
            - operator: DoesNotExist
              key: fm-key
          topologyKey: fm-topologykey
        weight: 1
