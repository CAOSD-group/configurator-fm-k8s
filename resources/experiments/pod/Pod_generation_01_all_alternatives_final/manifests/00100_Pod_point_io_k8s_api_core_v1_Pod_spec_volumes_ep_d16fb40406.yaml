apiVersion: v1
kind: Pod
metadata:
  name: fm-pilot-pod
spec:
  containers:
  - name: fm-container-1
  volumes:
  - ephemeral:
      volumeClaimTemplate:
        spec:
          selector:
            matchExpressions:
            - operator: DoesNotExist
              key: fm-key
    name: fm-volume-1
