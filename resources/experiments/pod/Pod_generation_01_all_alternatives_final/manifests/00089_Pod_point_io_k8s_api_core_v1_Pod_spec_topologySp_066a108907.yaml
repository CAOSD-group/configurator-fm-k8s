apiVersion: v1
kind: Pod
metadata:
  name: fm-pilot-pod
spec:
  containers:
  - name: fm-container-1
  topologySpreadConstraints:
  - labelSelector:
      matchExpressions:
      - operator: DoesNotExist
        key: fm-key
    maxSkew: 1
    topologyKey: fm-topologykey-1
    whenUnsatisfiable: fm-whenunsatisfiable-1
